[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cycloscg"
version = "0.1.0"
description = "Cardiac-phase/cyclostationarity-guided SCG reconstruction under motion interference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "torch>=2.2",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "openpyxl>=3.1"]

[project.scripts]
cycloscg-inspect = "cycloscg.cli:inspect_main"
cycloscg-split = "cycloscg.cli:split_main"
cycloscg-verify-rpeaks = "cycloscg.cli:rpeak_main"
cycloscg-train-baseline = "cycloscg.cli:baseline_main"
cycloscg-train = "cycloscg.cli:cycloscg_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
